<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">HertPicture Windows app preview</title>
  <desc id="desc">A preview of the HertPicture desktop interface with image batches, processing status, and export details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dff7ec"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1440" height="960" fill="url(#bg)"/>
  <rect x="96" y="84" width="1248" height="792" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="96" y="84" width="1248" height="76" rx="28" fill="#0f172a"/>
  <circle cx="134" cy="122" r="10" fill="#fb7185"/>
  <circle cx="164" cy="122" r="10" fill="#fbbf24"/>
  <circle cx="194" cy="122" r="10" fill="#34d399"/>
  <text x="232" y="130" fill="#d1d5db" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">HertPicture</text>
  <rect x="120" y="184" width="248" height="668" rx="18" fill="#0f172a"/>
  <text x="148" y="232" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Library</text>
  <rect x="148" y="272" width="192" height="46" rx="10" fill="url(#accent)"/>
  <text x="174" y="302" fill="#052e16" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Current batch</text>
  <rect x="148" y="340" width="172" height="16" rx="8" fill="#334155"/>
  <rect x="148" y="386" width="148" height="16" rx="8" fill="#334155"/>
  <rect x="148" y="432" width="184" height="16" rx="8" fill="#334155"/>
  <rect x="148" y="478" width="132" height="16" rx="8" fill="#334155"/>
  <rect x="148" y="736" width="192" height="76" rx="14" fill="#111827"/>
  <text x="168" y="768" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Ready to export</text>
  <text x="168" y="794" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">128 images</text>
  <text x="408" y="232" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Picture batch overview</text>
  <text x="408" y="266" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Review files, processing status, and export readiness in one place.</text>
  <rect x="408" y="306" width="284" height="132" rx="18" fill="#ecfdf5" stroke="#bbf7d0"/>
  <rect x="724" y="306" width="284" height="132" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="1040" y="306" width="244" height="132" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="436" y="352" fill="#166534" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Processed</text>
  <text x="436" y="396" fill="#052e16" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">96</text>
  <text x="752" y="352" fill="#1d4ed8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Queued</text>
  <text x="752" y="396" fill="#172554" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">32</text>
  <text x="1068" y="352" fill="#c2410c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Warnings</text>
  <text x="1068" y="396" fill="#431407" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">3</text>
  <rect x="408" y="484" width="876" height="286" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="436" y="532" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Recent image tasks</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">
    <rect x="436" y="568" width="820" height="54" rx="12" fill="#ffffff"/>
    <text x="460" y="602" fill="#0f172a" font-weight="700">Vacation_album_042.jpg</text>
    <text x="832" y="602" fill="#64748b">Resize + compress</text>
    <rect x="1128" y="584" width="96" height="22" rx="11" fill="#bbf7d0"/>
    <text x="1148" y="601" fill="#166534" font-size="13" font-weight="800">Done</text>
    <rect x="436" y="638" width="820" height="54" rx="12" fill="#ffffff"/>
    <text x="460" y="672" fill="#0f172a" font-weight="700">Product_gallery.zip</text>
    <text x="832" y="672" fill="#64748b">Metadata scan</text>
    <rect x="1128" y="654" width="96" height="22" rx="11" fill="#bfdbfe"/>
    <text x="1148" y="671" fill="#1d4ed8" font-size="13" font-weight="800">Active</text>
    <rect x="436" y="708" width="820" height="54" rx="12" fill="#ffffff"/>
    <text x="460" y="742" fill="#0f172a" font-weight="700">Archive_2026_04</text>
    <text x="832" y="742" fill="#64748b">Export package</text>
    <rect x="1128" y="724" width="96" height="22" rx="11" fill="#fed7aa"/>
    <text x="1148" y="741" fill="#c2410c" font-size="13" font-weight="800">Review</text>
  </g>
</svg>
